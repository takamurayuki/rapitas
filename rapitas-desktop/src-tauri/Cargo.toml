[package]
name = "rapitas"
version = "1.0.0"
description = "Rapitas - AI-Powered Task Management Desktop App"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# macos-private-api: required for WebviewWindowBuilder::transparent() to compile
# on macOS (tauri gates it behind this feature there; other OSes need no flag).
# unstable: the ONLY way to dock a webview inside an existing window —
# `Window::add_child` is `#[cfg(all(desktop, feature = "unstable"))]` in tauri
# 2.10.x. link_webview.rs needs it so a note's link can be read in a pane
# instead of the external browser; an iframe cannot do that job because sites
# sending X-Frame-Options render blank. Outside tauri's semver guarantee, so a
# tauri bump must be checked against link_webview.rs before it lands.
tauri = { version = "2.10.1", features = [
  "tray-icon",
  "image-png",
  "macos-private-api",
  "unstable",
] }
tauri-plugin-shell = "2.3"
tauri-plugin-global-shortcut = "2.3"
# NOTE: tauri-plugin-updater is removed, not merely disabled — it is the only
# dependent of `zip`, which ships RUSTSEC-2026-0369 (critical 9.1),
# RUSTSEC-2026-0367 and -0368, all fixed in >= 9.0.0. Every published
# tauri-plugin-updater up to 2.14.0 still requires `zip = "^4"`, a line that
# is entirely yanked, so no override can reach a fixed version. Restore this
# together with the capability, the plugins.updater config and the
# UPDATER_ENABLED flag in UpdateBanner.tsx once upstream builds on zip ^9.
# See #978.
tauri-plugin-process = "2.3"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
open = "5"
# Voice recognition: audio capture + WAV export + subprocess whisper.cpp
cpal = "0.15"
hound = "3.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# Integrated terminal: cross-platform PTY (ConPTY on Windows) for an in-app
# VS Code-like terminal. base64 keeps raw byte output intact across the IPC
# boundary (avoids UTF-8 corruption when a multibyte char spans read chunks).
portable-pty = "0.9"
base64 = "0.22"
# Pomodoro float window glass transparency (acrylic) — see pomodoro_float.rs.
window-vibrancy = "0.6"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "psapi", "shellapi", "winreg", "dwmapi"] }
# AppUserModelID registration — Windows silently drops toast notifications
# whose AUMID isn't registered (dev/portable runs have no installer to do it).
winreg = "0.52"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
# 開発モードではdefaultを空にしてdevUrlを使用
# 本番ビルドでは --features custom-protocol を指定
default = []
custom-protocol = ["tauri/custom-protocol"]
