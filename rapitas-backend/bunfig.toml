[test]
# NOTE: Do NOT set `coverage = false` here — in bun 1.3.13 it silently overrides
# the CLI `--coverage` flag, which left the CI gate's coverage measurement dead
# for months (ADR-0002 Phase A regression). Coverage stays off by default for
# plain `bun test`; the backend-tests gate opts in via its `--coverage` arg.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# Exclude test files themselves from the coverage denominator — counting them
# inflates the percentage with self-covering code.
coverageSkipTestFiles = true
# Exclude the generated Prisma client bundles from the coverage denominator.
# generated/prisma-postgres/runtime/library.js alone contributes ~1067
# functions (883 uncovered) — third-party generated code nobody writes tests
# for, but it was silently dragging the backend-tests gate's function-coverage
# floor down from ~88% to ~48% (discovered 2026-07-22; see ADR-0002).
coveragePathIgnorePatterns = ["generated/**"]
# Exclude integration tests from default run (they don't use mock.module)
# Run them separately with: bun test --path-ignore-patterns="" ./tests/integration/
pathIgnorePatterns = ["tests/integration/**"]
# Isolate each test file in its own module registry to prevent mock.module
# process-global contamination from leaking across files (mirrors --isolate CLI flag).
isolate = true
# NOTE: NODE_ENV=test disables the logger's file sink so test-generated errors
# do not contaminate the shared daily log file (~/.rapitas/logs/).
# Bun 1.3.13 on Windows does not set NODE_ENV automatically for bun test.
preload = ["./tests/setup.ts", "./tests/setup/global-state-guard.ts"]
# NOTE: For parallel execution across files (OSプロセス境界でmock.module污染を防ぐ),
# use `bun run test:parallel` (scripts/parallel-test.ts).
# Each file runs as an independent `bun test --isolate <file>` subprocess.
