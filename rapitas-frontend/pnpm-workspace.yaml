# pnpm v10 treats this file as a workspace root and rejects the install with
# "packages field missing or empty" when it is absent. rapitas-frontend is a
# single package, so the workspace contains just itself.
packages:
  - '.'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - fast-uri@3.1.1 || 3.1.2 || 3.1.3 || 3.1.4
  - ws@8.20.1 || 8.21.0
  - uuid@11.1.1
  - qs@6.15.2
  - '@babel/plugin-transform-modules-systemjs@7.29.4'
  - brace-expansion@1.1.16 || 1.1.17 || 5.0.6 || 5.0.7 || 5.0.8
  - esbuild@0.28.1
  - vite@7.3.5
  - dompurify@3.4.6 || 3.4.7 || 3.4.8 || 3.4.9 || 3.4.11 || 3.4.12
  - undici@7.28.0
  - js-yaml@4.1.2 || 4.3.0
  - '@babel/core@7.29.1'
  - sharp@0.35.0
  - '@next/env@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - eslint-config-next@16.4.1
  - next@16.4.1
  - brace-expansion@1.1.20 || 5.0.11
  - fast-uri@3.1.7
  - js-yaml@4.3.2
  - nanoid@3.3.18
  - undici@7.29.1
overrides:
  # NOTE: ONE entry per package per major line. Only the FIRST matching
  # range selector takes effect -- appending a stricter rule below an
  # existing one is silently dead (measured: dompurify has 7 selectors and
  # the lock's importer specifier is the first one's value). To raise a
  # floor, EDIT the entry; never add a second one for the same major.
  '@babel/core@<=7.29.0': ^7.29.1
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3': ^7.29.4
  brace-expansion@>=1.0.0 <1.1.20: ^1.1.20
  brace-expansion@>=5.0.0 <5.0.11: ^5.0.11
  dompurify@<3.4.7: ^3.4.7
  dompurify@<3.4.9: ^3.4.9
  dompurify@<=3.4.10: ^3.4.11
  dompurify@<=3.4.11: ^3.4.12
  dompurify@<=3.4.5: ^3.4.6
  dompurify@<=3.4.6: ^3.4.7
  dompurify@>=3.0.0 <=3.4.7: ^3.4.8
  # NOTE: no elliptic override — the advisory's patched version (6.6.2) is not
  # published yet (low severity, storybook dev-only chain). Re-add when released.
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  fast-uri@>=3.0.0 <3.1.7: ^3.1.7
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid@>=3.0.0 <3.3.18: ^3.3.18
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  qs@>=6.11.1 <=6.15.1: ^6.15.2
  sharp@<0.35.0: ^0.35.0
  undici@>=7.0.0 <7.29.1: ^7.29.1
  uuid@<11.1.1: ^11.1.1
  vite: ^7.3.2
  vite@>=7.0.0 <=7.3.4: ^7.3.5
  ws@>=8.0.0 <8.20.1: ^8.20.1
  ws@>=8.0.0 <8.21.0: ^8.21.0
