# pnpm v10 treats this file as a workspace root and rejects the install with
# "packages field missing or empty" when it is absent. rapitas-frontend is a
# single package, so the workspace contains just itself.
packages:
  - '.'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - postcss@8.5.10
  - fast-uri@3.1.1
  - fast-uri@3.1.2
  - ws@8.20.1
  - uuid@11.1.1
  - qs@6.15.2
  - '@babel/plugin-transform-modules-systemjs@7.29.4'
  - brace-expansion@5.0.6
  - esbuild@0.28.1
  - vite@7.3.5
  - dompurify@3.4.6
  - dompurify@3.4.7
  - undici@7.28.0
  - js-yaml@4.1.2
  - ws@8.21.0
  - '@babel/core@7.29.1'
  - brace-expansion@1.1.16
  - brace-expansion@5.0.7
  - js-yaml@4.3.0
  - dompurify@3.4.12
  - fast-uri@3.1.4
  - sharp@0.35.0
  - dompurify@3.4.11
  - dompurify@3.4.9
  - dompurify@3.4.8
  - postcss@8.5.12
  - postcss@8.5.18
  - fast-uri@3.1.3
  - brace-expansion@1.1.17
  - brace-expansion@5.0.8
overrides:
  '@babel/core@<=7.29.0': ^7.29.1
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3': ^7.29.4
  brace-expansion@<1.1.16: ^1.1.16
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@>=3.0.0 <5.0.7: ^5.0.7
  brace-expansion@>=4.0.0 <5.0.8: ^5.0.8
  brace-expansion@>=5.0.0 <5.0.6: ^5.0.6
  dompurify@<3.4.7: ^3.4.7
  dompurify@<3.4.9: ^3.4.9
  dompurify@<=3.4.10: ^3.4.11
  dompurify@<=3.4.11: ^3.4.12
  dompurify@<=3.4.5: ^3.4.6
  dompurify@<=3.4.6: ^3.4.7
  dompurify@>=3.0.0 <=3.4.7: ^3.4.8
  # NOTE: no elliptic override — the advisory's patched version (6.6.2) is not
  # published yet (low severity, storybook dev-only chain). Re-add when released.
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  fast-uri@<=3.1.0: ^3.1.1
  fast-uri@<=3.1.1: ^3.1.2
  fast-uri@>=3.0.0 <3.1.3: ^3.1.3
  fast-uri@>=3.0.0 <=3.1.3: ^3.1.4
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  js-yaml@>=4.0.0 <=4.1.1: ^4.1.2
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  qs@>=6.11.1 <=6.15.1: ^6.15.2
  sharp@<0.35.0: ^0.35.0
  undici@>=7.0.0 <7.28.0: ^7.28.0
  undici@>=7.23.0 <7.28.0: ^7.28.0
  uuid@<11.1.1: ^11.1.1
  vite@>=7.0.0 <=7.3.4: ^7.3.5
