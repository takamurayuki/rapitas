name: Version Sync Check

on:
  push:
    branches:
      - master
      - main
      - develop
    paths:
      - 'package.json'
      - 'rapitas-desktop/package.json'
      - 'rapitas-desktop/src-tauri/tauri.conf.json'
      - 'rapitas-desktop/src-tauri/tauri.ci.conf.json'
      - 'rapitas-desktop/src-tauri/Cargo.toml'
      - 'scripts/sync-version.cjs'
      - '.github/workflows/version-check.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'rapitas-desktop/package.json'
      - 'rapitas-desktop/src-tauri/tauri.conf.json'
      - 'rapitas-desktop/src-tauri/tauri.ci.conf.json'
      - 'rapitas-desktop/src-tauri/Cargo.toml'
      - 'scripts/sync-version.cjs'
      - '.github/workflows/version-check.yml'

# Least privilege by default (zizmor excessive-permissions). This equals the
# repository's default read-only token minus packages:read, which nothing here
# uses. A job that needs more declares it at job level.
permissions:
  contents: read

jobs:
  version-check:
    name: Verify version is in sync across manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Run version sync check
        run: node scripts/sync-version.cjs --check
