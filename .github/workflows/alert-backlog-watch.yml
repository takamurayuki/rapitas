# Keeps ONE issue listing every code-scanning and Dependabot alert that has
# stayed open past its age limit (critical/high 7 days, medium 30, low 60),
# and closes it when the list is empty (#1390).
#
# Why an issue: 115 code-scanning and 24 Dependabot alerts piled up from
# 2026-02 on. The Security tab is not somewhere anyone looks, and the PR checks
# pass on notes, warnings and dev-only findings by design. Issues are read,
# and close-linked-issues (#1366) closes them when the fix merges.
name: Alert Backlog Watch

on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: read

concurrency:
  group: alert-backlog-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Report alerts past their age limit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Code scanning and the issue itself use the job token.
      GH_TOKEN: ${{ github.token }}
      # NOTE: The job token gets HTTP 403 on the Dependabot alerts API (first
      # run, 2026-11-03), so that one source reads with a fine-grained,
      # read-only SECURITY_ALERTS_TOKEN ("Dependabot alerts: read" on this repo).
      # Without it the run is RED and the issue says Dependabot is unread — it
      # never treats the refusal as "no alerts" and closes itself.
      DEPENDABOT_ALERTS_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Test the age and issue logic
        run: node --test scripts/security/alert-backlog-watch.test.cjs

      - name: Open, update or close the tracking issue
        run: node scripts/security/alert-backlog-watch.cjs
