name: Knip (Unused Code Detection)

on:
  pull_request:
    branches:
      - master
      - main
      - develop
    paths:
      - 'rapitas-frontend/**'
      - '.github/workflows/knip.yml'
  workflow_dispatch:

jobs:
  knip-frontend:
    name: Knip (frontend)
    runs-on: ubuntu-latest
    # Report-only for now: do not fail the build until baseline is clean.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.9

      - name: Install frontend dependencies
        working-directory: rapitas-frontend
        run: pnpm install --frozen-lockfile

      - name: Run knip
        working-directory: rapitas-frontend
        run: pnpm dlx knip@5 --reporter markdown --no-exit-code

      - name: Run knip (strict, advisory)
        working-directory: rapitas-frontend
        run: pnpm dlx knip@5
        continue-on-error: true
