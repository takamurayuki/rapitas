name: Update Release Assets

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  update-release:
    name: Update Release Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          # NOTE: zizmor cache-poisoning. This job writes to a published release,
          # so it must never restore a cache another run wrote.
          package-manager-cache: false

      - name: Generate update metadata
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          // Get release information from GitHub context
          const tagName = process.env.GITHUB_REF_NAME || '';
          const version = tagName.replace(/^v/, '');
          const releaseDate = new Date().toISOString();
          const releaseUrl = \`https://github.com/\${process.env.GITHUB_REPOSITORY}/releases/tag/\${tagName}\`;

          // Create update.json for Tauri updater
          const updateJson = {
            version: version,
            notes: 'Check the release page for detailed release notes',
            pub_date: releaseDate,
            platforms: {
              'darwin-x86_64': {
                signature: '',
                url: \`\${releaseUrl}/download/Rapitas_\${version}_x64.dmg\`
              },
              'darwin-aarch64': {
                signature: '',
                url: \`\${releaseUrl}/download/Rapitas_\${version}_aarch64.dmg\`
              },
              'linux-x86_64': {
                signature: '',
                url: \`\${releaseUrl}/download/rapitas_\${version}_amd64.AppImage\`
              },
              'windows-x86_64': {
                signature: '',
                url: \`\${releaseUrl}/download/Rapitas_\${version}_x64-setup.exe\`
              }
            }
          };

          fs.writeFileSync('update.json', JSON.stringify(updateJson, null, 2));
          console.log('Generated update.json:', updateJson);
          "
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Upload update.json
        # NOTE: zizmor suggests `gh release` instead (informational). Kept: on
        # workflow_dispatch this action creates the release when it is missing,
        # which a plain `gh release upload` does not, and the swap cannot be
        # exercised without publishing a release.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 # zizmor: ignore[superfluous-actions]
        with:
          files: update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}