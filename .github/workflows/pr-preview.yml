name: PR Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rapitas-frontend/**'
      - 'rapitas-backend/**'
      - 'rapitas-desktop/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'bun.lockb'

env:
  BUN_LOCKFILE_SKIP: true  # Skip lockfile validation in CI
  NEXT_TURBO: 0  # Disable Turbopack globally in CI

jobs:
  preview-info:
    name: Post Preview Info
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check if we already commented
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Preview Build')
            );

            const body = `🚀 **Preview Build**

            The CI/CD pipeline is building preview versions of Rapitas for this pull request.

            | Platform | Status |
            | --- | --- |
            | Windows | 🔄 Building... |
            | macOS | 🔄 Building... |
            | Linux | 🔄 Building... |

            Preview builds will be available as artifacts once the build completes.

            ---
            💡 *This comment will be updated as the build progresses.*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

  quick-build:
    name: Quick Build Check
    runs-on: ubuntu-latest

    # Backstop in place of GitHub's 6-hour default. 15m rather than the earlier
    # 40m because the apt install is gone (see the note in the steps): the
    # remaining work measured ~90s of the 22m39s this job took on PR #849, where
    # apt alone was 1164s of it.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.13'

      # NOTE: no Rust toolchain and no GTK/WebKit system libraries here any more.
      # They existed solely for a `cargo check` step that Check Rust Code's
      # `cargo clippy -- -D warnings` already subsumes (clippy runs the same
      # compile pass), and both are blocking checks — so the compile was gated
      # twice, a third time by Build (ubuntu-latest)'s full Tauri build. What is
      # left (`bun build --compile` and `next build`) needs neither.
      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install

      - name: Generate Prisma Client
        working-directory: rapitas-backend
        run: bunx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      # NOTE: `bun build --compile` statically resolves BOTH branches of the
      # provider ternary in config/prisma-client-resolver.ts, so the sqlite
      # client must exist too or the build fails with
      # `Could not resolve: "../generated/prisma-sqlite"` (same as tauri-build.yml).
      # First landed as af0aa051 on the task-538 PR branch, where a repair
      # bounce reverted it; the base branch is where it belongs.
      - name: Generate SQLite Prisma Client
        working-directory: rapitas-backend
        run: bun run db:prepare:sqlite
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"

      - name: Install frontend dependencies
        working-directory: rapitas-frontend
        run: pnpm install --no-frozen-lockfile

      - name: Install desktop dependencies
        working-directory: rapitas-desktop
        run: pnpm install --no-frozen-lockfile

      - name: Build backend
        working-directory: rapitas-backend
        run: |
          bun build index.ts --compile --outfile rapitas-backend
          mkdir -p ../rapitas-desktop/src-tauri/binaries
          cp rapitas-backend ../rapitas-desktop/src-tauri/binaries/rapitas-backend-x86_64-unknown-linux-gnu
          chmod +x ../rapitas-desktop/src-tauri/binaries/rapitas-backend-x86_64-unknown-linux-gnu

      - name: Build frontend
        working-directory: rapitas-frontend
        run: pnpm run build:tauri
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_TURBO: 0

      - name: Update PR comment on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Preview Build')
            );

            if (botComment) {
              const body = botComment.body.replace(
                '| Linux | 🔄 Building... |',
                '| Linux | ✅ Build check passed |'
              );

              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            }