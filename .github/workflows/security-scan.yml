name: Security Scan

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop
  schedule:
    - cron: '0 0 * * 1'  # Weekly scan on Monday

jobs:
  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 0.3m median / 0.5m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  rust-security:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 3.2m median / 4.1m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Update Rust dependencies
        working-directory: rapitas-desktop/src-tauri
        run: cargo update

      - name: Run cargo audit
        working-directory: rapitas-desktop/src-tauri
        run: cargo audit

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 0.2m median / 0.8m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Audit frontend dependencies
        working-directory: rapitas-frontend
        continue-on-error: true
        run: |
          pnpm audit --production
          pnpm audit --audit-level=high

      - name: Audit desktop dependencies
        working-directory: rapitas-desktop
        continue-on-error: true
        run: |
          pnpm audit --production
          pnpm audit --audit-level=high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 4.3-4.6m median / 5.7m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4