name: Security Scan

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop
  schedule:
    - cron: '0 0 * * 1'  # Weekly scan on Monday

# Least privilege by default (zizmor excessive-permissions). This equals the
# repository's default read-only token minus packages:read, which nothing here
# uses. A job that needs more declares it at job level.
permissions:
  contents: read

jobs:
  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 0.3m median / 0.5m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  rust-security:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 3.2m median / 4.1m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Audits the COMMITTED Cargo.lock — deliberately with no `cargo update`
      # first. Two reasons, both measured 2026-10-16 (#960):
      #   1. Updating first scored a tree that only ever existed in this
      #      runner. The committed lock held five packages with advisories
      #      (rustls, tauri, quick-xml, tar, serde_with) that this job
      #      reported as clean for as long as it existed, because it audited
      #      the updated tree instead — 587 crates resolved there against 607
      #      in the lock.
      #   2. It cannot succeed anyway: the `zip` crate keeps only its newest
      #      release unyanked (99 of its last 100 published versions are
      #      yanked) while every published `tauri-plugin-updater`, up to
      #      2.14.0, still requires `zip = "^4"` — now entirely yanked.
      #      Resolution fails before cargo-audit ever runs.
      # Keeping dependencies current is Dependabot's job; this gate's job is
      # to score what we actually ship. Do not reintroduce `cargo update`.
      - name: Run cargo audit
        working-directory: rapitas-desktop/src-tauri
        run: cargo audit

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 0.2m median / 0.8m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9

      # NOTE(#1340): needed because rapitas-backend uses bun, and this job had
      # no way to audit it — which is why that package had never been checked.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'

      # `bun audit` reads the installed tree, so without this it reports nothing
      # and the backend gate would pass by being blind rather than by being clean.
      #
      # NOTE(#1340): --frozen-lockfile on purpose. A plain `bun install` lets
      # CI resolve its own tree, and an audit of a tree that is not the one
      # that ships measures the wrong thing. The committed bun.lock is what
      # ships, so that is what gets audited. The bot PRs titled "Fix Bun
      # Lockfile Format" are not format fixes — they bump lockfileVersion 1→2
      # and upgrade packages across the tree — so the two can diverge, and this
      # flag makes that divergence fail loudly here instead of silently
      # changing what the gate measures.
      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install --frozen-lockfile

      # NOTE(#1340): restructured because this job was green while reporting
      # `##[error]Process completed with exit code 1`, and worse: both steps ran
      # two commands in one `run:` under `bash -e`, so a non-zero `--production`
      # ENDED the step and `--audit-level=high` never executed. The command that
      # exists to catch high findings only ran when nothing had been found.
      #
      # Now: REPORT first (always, advisory, into the Step Summary so a green
      # job can never be read as "no vulnerabilities"), GATE second, at high,
      # with written-down exceptions — see the gate step below.
      - name: Report all dependency advisories (advisory)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## 依存脆弱性レポート"
            echo
            echo "**緑は「脆弱性なし」ではない。** ゲートは本番依存の critical のみ。"
            echo "以下は dev 依存を含む全件。"
          } >> "$GITHUB_STEP_SUMMARY"
          # NOTE(#1340): piped through `tee` so the findings land in the step
          # LOG as well as the summary. Redirecting only into the summary left
          # no way to confirm from the API that this step had produced anything
          # — a reporting step whose output cannot be seen is indistinguishable
          # from one that silently wrote nothing.
          for pkg in rapitas-frontend rapitas-desktop; do
            {
              echo
              echo "### $pkg (pnpm, dev込み)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            (cd "$pkg" && pnpm audit 2>&1) | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo
            echo "### rapitas-backend (bun, dev込み)"
            echo "NOTE(#1340): このパッケージは監査工程が存在せず、一度も検査されていなかった。"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          (cd rapitas-backend && bun audit 2>&1) | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # NOTE(#1340): the gate was "production criticals only", which every one
      # of the 24 Dependabot alerts open on 2026-11-03 passed — measured: the
      # pre-fix frontend lock carried 5 highs (zod, 4x undici) and this job was
      # green. Now ANY high or critical, dev included, fails unless
      # .github/audit-exceptions.json excuses it with a reason and an expiry;
      # an expired exception fails too, so an accepted risk is re-read instead
      # of forgotten. The audits write JSON and exit non-zero on findings, so
      # `|| true` keeps the step going; an audit that wrote nothing makes the
      # gate's JSON.parse fail, so a blind audit still turns this red.
      - name: Collect audit JSON
        if: always()
        run: |
          (cd rapitas-frontend && pnpm audit --json > "$RUNNER_TEMP/fe.json" || true)
          (cd rapitas-desktop && pnpm audit --json > "$RUNNER_TEMP/desk.json" || true)
          (cd rapitas-backend && bun audit --json > "$RUNNER_TEMP/be.json" || true)

      - name: Gate — high or above, dev included, unless excepted
        if: always()
        run: >-
          node scripts/security/audit-gate.cjs
          "frontend=$RUNNER_TEMP/fe.json:pnpm"
          "desktop=$RUNNER_TEMP/desk.json:pnpm"
          "backend=$RUNNER_TEMP/be.json:bun"

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 4.3-4.6m median / 5.7m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4