name: TODO/HACK Ceiling

on:
  pull_request:
    branches:
      - master
      - main
      - develop
    paths:
      - 'rapitas-backend/**'
      - 'rapitas-frontend/src/**'
      - 'rapitas-desktop/src-tauri/src/**'
      - 'scripts/check-todos.cjs'
      - '.github/workflows/todos-check.yml'
  workflow_dispatch:

# Least privilege by default (zizmor excessive-permissions). This equals the
# repository's default read-only token minus packages:read, which nothing here
# uses. A job that needs more declares it at job level.
permissions:
  contents: read

jobs:
  todos:
    name: Enforce HACK/FIXME ceilings (ADR-0004)
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 0.2m median / 0.8m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # Baseline measured 2026-04-08 in ADR-0004.
      # Lower these numbers as the ratchet advances; never raise them.
      - name: Check TODO/HACK ceiling
        run: node scripts/check-todos.cjs --max-hack 14 --max-fixme 1
