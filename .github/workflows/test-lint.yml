name: Test and Lint

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

env:
  BUN_LOCKFILE_SKIP: true  # Skip lockfile validation in CI
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege by default (zizmor excessive-permissions). This equals the
# repository's default read-only token minus packages:read, which nothing here
# uses. A job that needs more declares it at job level.
permissions:
  contents: read

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 0.8m median / 1.1m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: rapitas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history: the changed-tests step diffs against the PR base (#1410).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'

      - name: Install backend dependencies
        working-directory: rapitas-backend
      # NOTE(#1340): --frozen-lockfile. A plain `bun install` re-resolves the tree
      # against package.json ranges, so a job could run against dependencies the
      # committed bun.lock never recorded. The dedicated Frozen Install job
      # proves the lockfile is installable; it cannot stop another job from
      # resolving something else, which is what the #1349 review pointed out.
        run: bun install --frozen-lockfile

      - name: Setup test database
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
        run: |
          bunx prisma db push --skip-generate
          bunx prisma generate

      - name: Run backend gate suite with coverage
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
          # This job runs a real PostgreSQL service, so the BYO-database
          # integration test must reach it rather than skip (#1285).
          RAPITAS_REQUIRE_PG_INTEGRATION: '1'
        # NOTE: File list is maintained in scripts/ci-gate-tests.txt (single source of truth).
        # To add/remove files, edit that manifest — do NOT modify this step.
        # See .github/TESTING_POLICY.md for the gate escalation path.
        run: bun run test:ci

      - name: Print backend coverage summary
        working-directory: rapitas-backend
        run: echo "Backend gate suite coverage printed above."

      - name: Evaluate workflow quality gates
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
        run: bun run eval:gates

      # #1410: every test file this PR adds or modifies runs here, with no
      # registration in scripts/ci-gate-tests.txt, and is green only when
      # bun's junit report shows each one ran and bun exited 0. Separate from
      # the coverage-measured gate above so it cannot move the floors.
      - name: Run the tests this PR adds or changes (backend)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
          # Passed through env, not expanded into the script: a branch name is
          # attacker-chosen text (zizmor template-injection).
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/gates/changed-tests-gate.cjs --package backend --base "origin/${BASE_REF}"

  # Blocking, and deliberately SEPARATE from test-backend: these tests pin that
  # routes go through their choke points (delete guard, stop reporting, the
  # incremental-fetch boundary). Putting them in the coverage-measured gate
  # pulled their 600-line route modules into the denominator and took function
  # coverage from 51.9% to 46.9%, under its 50% floor (#1330). ADR-0002 says
  # add tests, never lower the floor — so the wiring is gated here, without
  # --coverage, where it costs the floor nothing (#1332).
  route-regression:
    name: Route Regression
    runs-on: ubuntu-latest
    # Hang backstop only; the suite is ~1.3s locally. Same rationale as test-backend.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: rapitas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'

      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install --frozen-lockfile

      - name: Setup test database
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
        run: |
          bunx prisma db push --skip-generate
          bunx prisma generate

      - name: Run route regression suite
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
        # NOTE: File list is maintained in scripts/route-regression-tests.txt
        # (single source of truth). To add/remove files, edit that manifest —
        # do NOT modify this step.
        run: bun run test:routes

  # Advisory: runs the full test suite in parallel across OS processes.
  # continue-on-error: true — failures are visible in Step Summary but do NOT block merges.
  # See .github/TESTING_POLICY.md §"失敗ティア表" for the rationale.
  test-full-advisory:
    name: Full Suite (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    # continue-on-error keeps a FAILURE advisory, but an unfinished job still
    # holds the whole run at in_progress. On 2026-10-07 this job hung 54 minutes
    # in its browser-install step and blocked PR #848's merge that way. 4.0m
    # median / 6.4m max over the last 25 runs, so 20m bounds a hang without
    # constraining a normal run.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: rapitas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'

      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install --frozen-lockfile

      - name: Setup test database
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
        run: |
          bunx prisma db push --skip-generate
          bunx prisma generate

      - name: Prepare SQLite client for isolated database tests
        working-directory: rapitas-backend
        env:
          DATABASE_URL: file:./isolated-tests.db
          RAPITAS_DB_PROVIDER: sqlite
        run: bun run db:generate:sqlite

      # Real browser processes must not compete with the parallel unit-test pool.
      - name: Install matching browser for readiness checks
        working-directory: rapitas-backend
        run: node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell

      - name: Verify application readiness in a real browser
        working-directory: rapitas-backend
        env:
          RAPITAS_TEST_BROWSER_CHANNEL: chromium-headless-shell
        run: bun test --isolate services/agents/verification/runtime-smoke/runtime-readiness.test.ts

      - name: Run full test suite (parallel, advisory)
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
          # NOTE: GitHub hosted runners provide 2 vCPUs; higher concurrency risks OOM/port conflicts.
          RAPITAS_TEST_CONCURRENCY: 2
        run: bun run test:parallel

      - name: Write failed files to Step Summary
        if: failure()
        working-directory: rapitas-backend
        run: |
          {
            echo "## Full Suite Advisory — Failed Files"
            echo ""
            echo "These failures do **not** block the merge. Fix them to keep the advisory green."
            echo ""
            echo '```'
            bun run test:parallel 2>&1 | grep 'FAIL ' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test-order-check:
    name: Test Order Dependency Check
    runs-on: ubuntu-latest
    # Same reason as test-full-advisory: continue-on-error stops a FAILURE from
    # blocking, but an unfinished job holds the run at in_progress and the
    # pre-merge gate waits on the run. 0.3m median / 0.4m max over the last 25
    # runs, so 15m is purely a hang backstop.
    timeout-minutes: 15
    # NOTE: continue-on-error keeps this job advisory (visibility only; does not block merges).
    # Escalation criterion: when `bun run test:shuffle` passes for 10 consecutive develop runs
    # with no seed-dependent failures, remove continue-on-error to enforce strict mode.
    # Track progress in the concerns backlog (label: test-order-flaky).
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'

      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: rapitas-backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: bunx prisma generate

      - name: Run tests in shuffled order
        working-directory: rapitas-backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          TEST_SHUFFLE_SEED: ${{ github.run_number }}
        run: |
          echo "Shuffle seed: $TEST_SHUFFLE_SEED  (pass TEST_SHUFFLE_SEED=$TEST_SHUFFLE_SEED to reproduce)"
          bun run test:shuffle

  test-sqlite:
    name: Test SQLite Compatible Suite
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 0.5m median / 0.9m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'

      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install --frozen-lockfile

      - name: Generate SQLite Prisma Client
        working-directory: rapitas-backend
        run: bun run db:prepare:sqlite
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"

      - name: Run SQLite compatible tests
        working-directory: rapitas-backend
        run: bun run test:sqlite
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"

  check-frontend:
    name: Check Frontend
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 1.9m median / 2.1m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history: the changed-tests step diffs against the PR base (#1410).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        working-directory: rapitas-frontend
        run: pnpm install --frozen-lockfile

      # NOTE(#1340 step 1): the Bun setup and `bun install` that used to sit
      # here are gone, and the tests run through pnpm instead.
      #
      # `rapitas-frontend/bun.lock` is gitignored — pnpm-lock.yaml is this
      # package's source of truth. But the job ran `pnpm install` and then
      # `bun install` in the SAME directory, and with no bun lockfile to read,
      # bun resolved straight from package.json: newest version satisfying each
      # range, pnpm-lock.yaml ignored, node_modules mutated after pnpm had
      # populated it. The frontend gate was therefore testing a tree that the
      # committed lockfile does not describe.
      #
      # Verified the gate's own file list passes under node-run vitest before
      # removing bun: `vitest run --coverage <the list>` exits 0 with all four
      # coverage floors met.
      - name: Run TypeScript type check
        working-directory: rapitas-frontend
        run: pnpm tsc --noEmit

      - name: Run frontend gate tests
        working-directory: rapitas-frontend
        # NOTE: --coverage makes the vitest.config.ts threshold floor a real,
        # enforced gate (it was previously aspirational — coverage never ran in
        # CI). The floor is calibrated to the manifest's file list.
        #
        # NOTE(#1410): vitest SILENTLY IGNORES a path that does not exist and
        # still exits 0 (measured 2026-10-26, and again when two files moved
        # in #1376 dropped out of this gate unnoticed). So the list lives in
        # rapitas-frontend/scripts/ci-gate-tests.txt and runs through
        # vitest-manifest-gate, which fails when a listed file is missing or
        # did not actually run according to vitest's own JSON report.
        run: node ../scripts/gates/vitest-manifest-gate.cjs scripts/ci-gate-tests.txt -- --coverage

      # #1410: every frontend test file this PR adds or modifies runs here
      # without registration in the manifest, verified the same way as the
      # gate above (each file must appear in vitest's own report).
      - name: Run the tests this PR adds or changes (frontend)
        if: github.event_name == 'pull_request'
        env:
          # Same as the backend step: keep the branch name out of the script.
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/gates/changed-tests-gate.cjs --package frontend --base "origin/${BASE_REF}"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 3.1m median / 3.2m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # NOTE (#1410): import direction and cycles, as a ratchet. Fails on a new
      # backend services/ → routes/ (or utils|config → services|routes) import,
      # a frontend components/ui → feature|app or lib|utils → app import, or a
      # new runtime import cycle; today's ones are listed in
      # scripts/import-graph/import-graph-baseline.json, which may only shrink
      # (an entry that no longer occurs fails too). Dependency-free, so it
      # runs before the installs and fails fast. ~4s.
      - name: Import direction and cycles
        run: node scripts/import-graph/check-import-graph.cjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client (needed for tsc)
        working-directory: rapitas-backend
        run: bunx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Install frontend dependencies
        working-directory: rapitas-frontend
        run: pnpm install --frozen-lockfile

      # NOTE: Generate the SQLite client BEFORE the first tsc. Since a460cc8f the
      # two clients live in separate folders (generated/prisma-postgres and
      # generated/prisma-sqlite), and tsc type-checks test helpers that are not
      # *.test.ts — e.g. services/workflow/acceptance/*.test-helpers.ts (#1477),
      # which type the SQLite harness DB with the SQLite client. Generated after
      # tsc, that import was unresolved (TS2307) and every PrismaClient value in
      # those helpers degraded to any (TS7006), failing Lint Code on develop.
      - name: Check desktop SQLite Prisma generation
        working-directory: rapitas-backend
        run: bun run db:prepare:sqlite
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"

      - name: Check backend TypeScript
        working-directory: rapitas-backend
        run: bunx tsc --noEmit

      - name: Verify SQLite generated artifacts match committed files
        working-directory: rapitas-backend
        run: |
          if ! git diff --exit-code prisma/schema.desktop/ src/generated/sqlite-init-sql.ts; then
            echo ""
            echo "ERROR: SQLite generated artifacts are out of sync with the Prisma schema."
            echo "Run 'bun run db:prepare:sqlite' in rapitas-backend/ and commit the regenerated files."
            exit 1
          fi

      # The DDL a user's own database is initialized with (#1285) must match
      # the schema, or "initialize" would create an out-of-date database.
      - name: Verify PostgreSQL init SQL matches the schema
        working-directory: rapitas-backend
        run: |
          bun run db:prepare:postgres-init
          if ! git diff --exit-code src/generated/postgres-init-sql.ts; then
            echo ""
            echo "ERROR: src/generated/postgres-init-sql.ts is out of sync with prisma/schema."
            echo "Run 'bun run db:prepare:postgres-init' in rapitas-backend/ and commit the result."
            exit 1
          fi

      - name: Check backend TypeScript with SQLite Prisma Client
        working-directory: rapitas-backend
        run: bunx tsc --noEmit
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"

      - name: Check backend formatting
        working-directory: rapitas-backend
        run: bunx prettier --check "**/*.ts" --ignore-path .gitignore

      - name: Check boundary guide drift
        working-directory: rapitas-backend
        # NOTE: Verifies docs/boundary-guide.generated.md is in sync with
        # tests/helpers/boundary-values.ts. Run `bun run gen:boundary-guide` to fix.
        run: bun run check:boundary-guide

      - name: Check type-guard drift
        working-directory: rapitas-backend
        # NOTE: Verifies *.guards.generated.ts files are in sync with their SSOT sources.
        # Run `bun run gen:type-guards` to regenerate and commit the updated files.
        run: bun run check:type-guards

      - name: Check route barrel drift
        working-directory: rapitas-backend
        # NOTE: Verifies routes/<domain>/index.ts is in sync with
        # route-barrel-legacy-manifest.json + *.routes.ts auto-discovery.
        # Run `bun run generate:route-barrels` and commit the updated files.
        run: bun run generate:route-barrels:check

      # NOTE(#1340 step 1): every workflow must install the versions declared in
      # .github/toolchain.json. Three Bun versions were writing and validating
      # one bun.lock — 1.3.13 in the gates, 1.3.11 in update-lockfiles AND in
      # the release build's matrix, 'latest' in seven jobs including the
      # lockfile bot — and bun 1.3.13 writes lockfileVersion 1 while a newer
      # bun writes 2. An audit, a test run and a release build cannot be said
      # to use the same dependencies while the resolver version varies.
      - name: Check toolchain version drift
        working-directory: rapitas-backend
        run: bun run check:toolchain

      - name: Check determinism guard (advisory)
        working-directory: rapitas-backend
        continue-on-error: true
        # NOTE: Advisory only — surfaces prompt-nondeterminism heuristics (unordered
        # findMany feeding a prompt, missing temperature, wall-clock/random in prompt
        # builders) without blocking merges. See scripts/check-determinism.cjs.
        run: bun run determinism:check

      # NOTE(#1332): Until this step existed, NO job ran ESLint over the
      # backend — `Lint Code` only type-checked it — so all three local rules
      # declared as "error" in eslint.config.mjs had never once been applied
      # to the code they exist to police:
      #   local/no-raw-prisma-insensitive
      #   local/no-unscoped-pr-number-lookup
      #   local/no-unguarded-task-delete
      # Their own unit tests were in the gate, which proved the rules work but
      # not that anything runs them. Exactly docs/lessons/gates-that-do-not-
      # measure.md. Verified red by reintroducing a raw `prisma.task.delete`.
      # Warnings do not fail (280 today, same policy as the frontend); errors do.
      - name: Lint backend code
        working-directory: rapitas-backend
        run: bun run lint

      - name: Lint frontend code
        working-directory: rapitas-frontend
        run: pnpm lint

      - name: Check frontend formatting
        working-directory: rapitas-frontend
        run: pnpm prettier --check "src/**/*.{ts,tsx,js,jsx,css,md}"

  rust-check:
    name: Check Rust Code
    runs-on: ubuntu-latest

    # Blocking auto-merge check that runs the apt installer — the step that hung
    # indefinitely on 2 of the last 40 tauri-build runs. 1.2m median / 15.0m max
    # over the last 25 runs (cold rust cache). 45m so the installer's retry
    # budget (2 x 600s) plus a cold-cache clippy run finishes inside the bound;
    # being killed mid-retry would red a blocking check over an apt outage.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './rapitas-desktop/src-tauri -> target'

      # Guards the retry/timeout wrapper every ubuntu job depends on: an apt
      # hang here used to hold a blocking auto-merge check for hours, and a
      # wrapper that swallows apt's exit code would turn that into a green
      # build. ~4s, and it runs before the installer it is testing.
      - name: Test the system-dependency installer
        run: node --test scripts/install-ci-system-deps.test.cjs

      # Every root script test, by glob, so a new one cannot be left unwired.
      # Until #1367 only two of six ran: the tests for primary-guard-hook,
      # run-checked and verification-command-hook — the hooks every agent
      # session depends on — ran nowhere. Includes the issue closer (#1365),
      # whose workflow only runs after a merge. ~10s.
      - name: Test the root script tools
        run: node --test "scripts/**/*.test.cjs"

      # #1403: the tracked tree had 76 files nobody meant to keep — agent
      # scratch dumps, logs, ignored-but-tracked dirs, one-shot scripts long
      # after use. Fails on any tracked-but-ignored file, any repo/package
      # root file off scripts/repo-hygiene/root-allowlist.json, and any
      # script under a scripts/ dir that nothing references. ~2s.
      - name: Repo hygiene
        run: node scripts/repo-hygiene/check-repo-hygiene.cjs

      # #1403: the code is the source of truth for the docs. Fails when a
      # current doc names a path that does not exist, a package.json script
      # that does not exist, a Node/Bun/pnpm version other than the pins, a
      # workflow status set other than WORKFLOW_STATUSES, or when the backend
      # starts reading an env var .env.example does not document (ratchet).
      # docs/archive, docs/adr and docs/lessons are history and exempt. ~2s.
      - name: Docs match the code
        run: node scripts/docs/check-docs-drift.cjs

      # The machine-checkable half of the "Documentation style" rules in
      # .claude/CLAUDE.md: no emoji or emoji-style status marks, and no
      # box-drawing diagrams (draw them in mermaid). Directory trees pass.
      # docs/archive is history and exempt; literal UI/tool output is
      # allow-listed per file, with a reason, in docs-style-ignore.json. ~1s.
      - name: Docs follow the style rules
        run: node scripts/docs/check-docs-style.cjs

      # NOTE: #1410 — .github/quality-gates.json is the one definition of which
      # checks gate a merge (branch protection is generated from it, and the
      # auto-merge reads it). On 2026-10-16 main required four job names that no
      # longer existed and every PR sat BLOCKED. Fails when a listed name is
      # reported by no job, a required check is path-filtered/continue-on-error/
      # if-gated, an advisory entry is past its review date, or a PR job is
      # unclassified. ~1s.
      - name: Quality gates match the workflows
        run: node scripts/gates/quality-gates.cjs --check

      # rapitas-desktop/scripts/*.test.cjs ran in NO workflow until now
      # (#1074): dev.js's helpers had tests that nothing executed, so they
      # could rot green. This is the desktop side of the step above (root
      # scripts/ — NOTE: an earlier version of this comment claimed the root
      # tests were already wired; they were not, see #1367). It costs ~1s on
      # every PR rather than only on a release build.
      - name: Test the desktop dev-server scripts
        working-directory: rapitas-desktop
        run: node --test scripts/*.test.cjs

      - name: Install system dependencies
        run: |
          bash scripts/install-ci-system-deps.sh \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - name: Check Rust formatting
        working-directory: rapitas-desktop/src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: rapitas-desktop/src-tauri
        env:
          CI: true
        run: cargo clippy -- -D warnings

  rust-check-windows:
    name: Check Rust Code (Windows)
    runs-on: windows-latest
    # Hang backstop, not a constraint: 1.8m median / 2.7m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 20
    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The guard hooks run on Windows in practice (Git Bash / PowerShell
      # paths), so their tests run here too, not only on Linux (#1367).
      - name: Test the root script tools (Windows)
        shell: bash
        run: node --test "scripts/**/*.test.cjs"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './rapitas-desktop/src-tauri -> target'

      - name: Run Clippy
        working-directory: rapitas-desktop/src-tauri
        env:
          CI: true
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: rapitas-desktop/src-tauri
        env:
          CI: true
        run: cargo test --workspace

  # NOTE(#1340 step 1, criterion 4): proves the committed lockfiles are
  # authoritative, on a runner that shares nothing with any other job.
  #
  # Every other install in this repository uses `--no-frozen-lockfile`, so
  # until now no path verified that the lockfiles actually describe an
  # installable tree — they could drift from package.json indefinitely and
  # nothing would say so. This job installs all three packages frozen and then
  # runs the required backend gates against that tree, so "the audit, the tests
  # and the release build use the same dependencies" is a checked claim rather
  # than an intention.
  #
  # It deliberately does NOT use a dependency cache: a warm cache can hide a
  # lockfile that no longer resolves from the registry.
  frozen-install:
    name: Frozen Install Verification
    runs-on: ubuntu-latest
    # Hang backstop only.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: rapitas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'

      - name: Backend — frozen install
        working-directory: rapitas-backend
        run: bun install --frozen-lockfile

      - name: Frontend — frozen install
        working-directory: rapitas-frontend
        run: pnpm install --frozen-lockfile

      - name: Desktop — frozen install
        working-directory: rapitas-desktop
        run: pnpm install --frozen-lockfile

      - name: Setup test database
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
        run: |
          bunx prisma db push --skip-generate
          bunx prisma generate

      # The gates, against the frozen tree rather than a resolved-fresh one.
      - name: Backend gate suite
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
        run: bun run test:ci

      - name: Route regression suite
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
        run: bun run test:routes

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## A frozen install or a gate failed on a clean runner"
            echo
            echo "This job installs every package with its lockfile held fixed and"
            echo "no dependency cache. A failure here means one of:"
            echo
            echo "- a lockfile no longer satisfies its package.json (reconcile them"
            echo "  deliberately — do NOT delete the lockfile and reinstall, which"
            echo "  upgrades everything it can)"
            echo "- a lockfile references something the registry no longer serves"
            echo "- the gates pass only against a freshly-resolved tree, which means"
            echo "  the committed lockfiles are not what is being tested elsewhere"
          } >> "$GITHUB_STEP_SUMMARY"
