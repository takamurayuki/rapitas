name: Bundle Size

on:
  pull_request:
    branches:
      - master
      - main
      - develop
    paths:
      - 'rapitas-frontend/**'
      - 'scripts/check-bundle-size.cjs'
      - '.github/workflows/bundle-size.yml'
  workflow_dispatch:

jobs:
  bundle-size:
    name: Check frontend bundle size
    runs-on: ubuntu-latest
    # Report-only for now: do not fail the build until budgets are tuned.
    continue-on-error: true
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_TURBO: '0'
      MAX_CHUNK_KB: '500'
      MAX_TOTAL_KB: '8000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.9

      - name: Install frontend dependencies
        working-directory: rapitas-frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: rapitas-frontend
        run: pnpm run build

      - name: Check bundle size
        run: node scripts/check-bundle-size.cjs rapitas-frontend/.next
