name: Actionlint

on:
  push:
    branches:
      - master
      - main
      - develop
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yml'

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    # Hang backstop, not a constraint: 0.2m median / 0.3m max over the last ~20 runs.
    # Two blocking checks hung in unrelated install steps on 2026-10-07 (apt,
    # then a browser install) and held merges for 66 and 113 minutes against
    # GitHub's 6-hour default, with no way out — cancelling a run makes it
    # `cancelled`, which the pre-merge gate reads as failed.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          matcher: true
          # Advisory for now — tauri-build.yml has pre-existing shellcheck
          # issues that need non-trivial fixes (embedded bash if/then syntax).
          fail-on-error: false
