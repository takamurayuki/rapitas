name: Bun Lockfile Check

# NOTE(#1340 step 1): this was "Fix Bun Lock", and it did harm.
#
# It ran `rm -f bun.lock && bun install`, so every run threw away the recorded
# resolution and resolved the tree afresh — picking the newest version
# satisfying each range. It then opened a PR titled "Fix Bun Lockfile Format"
# whose diff was a whole-tree dependency bump (lockfileVersion 1 -> 2, new
# transitive packages, dozens of version changes).
#
# Its stated premise was false. The PR body claimed "the old lockfile was using
# version 1 which is incompatible with the current version of Bun". bun 1.3.13
# WRITES lockfileVersion 1, and `bun install --frozen-lockfile` succeeds
# against the committed lockfile — verified in CI. Nothing was incompatible.
#
# It also triggered on `push` to any branch, so it opened one PR per feature
# branch; several stayed open against branches that had already merged
# (#1333, #1338, #1341). None were merged, correctly — nobody wants a silent
# dependency bump under a cosmetic title.
#
# What a lockfile job should do is say whether package.json and bun.lock
# disagree, and let a human decide. `--frozen-lockfile` does exactly that: it
# fails rather than writing. No rm, no commit, no PR.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rapitas-backend/package.json'
      - 'rapitas-backend/bun.lock'
      - '.github/workflows/fix-bun-lock.yml'

jobs:
  check-lock:
    name: Bun Lockfile Check
    runs-on: ubuntu-latest
    # Hang backstop only; the install is seconds.
    timeout-minutes: 10
    # Read-only: this job no longer writes to the repository.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        # v2 to match every other workflow; this was the last v1 caller.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Verify bun.lock matches package.json
        working-directory: rapitas-backend
        run: |
          echo "Committed lockfile version:"
          head -2 bun.lock
          # Fails if the lockfile does not satisfy package.json. Writes nothing.
          bun install --frozen-lockfile

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## bun.lock is out of sync with package.json"
            echo
            echo "\`bun install --frozen-lockfile\` failed, which means the committed"
            echo "lockfile does not satisfy the current package.json."
            echo
            echo "Fix it deliberately, in the main checkout:"
            echo
            echo '```'
            echo "cd rapitas-backend && bun install"
            echo '```'
            echo
            echo "Then commit the bun.lock change with the package.json change that"
            echo "caused it. Do NOT delete the lockfile first — a fresh resolve"
            echo "upgrades every dependency it can, which is a separate decision"
            echo "from the one you are making."
          } >> "$GITHUB_STEP_SUMMARY"
