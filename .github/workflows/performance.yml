# Performance measurement workflow
# Runs performance tests and reports results

name: Performance

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'rapitas-backend/**'
      - 'rapitas-frontend/**'
      - 'scripts/measure-performance.cjs'
  pull_request:
    # `push` above already covers develop, so this ran only AFTER a merge —
    # a regression was measured once it was already on the branch. Adding
    # develop here moves the measurement ahead of the merge.
    branches: [master, main, develop]
    paths:
      - 'rapitas-backend/**'
      - 'rapitas-frontend/**'
  schedule:
    # Run weekly on Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Least privilege by default (zizmor excessive-permissions). This equals the
# repository's default read-only token minus packages:read, which nothing here
# uses. A job that needs more declares it at job level.
permissions:
  contents: read

jobs:
  backend-performance:
    name: Backend Performance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: rapitas
          POSTGRES_PASSWORD: rapitas
          POSTGRES_DB: rapitas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'

      - name: Install backend dependencies
        working-directory: rapitas-backend
      # NOTE(#1340): --frozen-lockfile. A plain `bun install` re-resolves the tree
      # against package.json ranges, so a job could run against dependencies the
      # committed bun.lock never recorded. The dedicated Frozen Install job
      # proves the lockfile is installable; it cannot stop another job from
      # resolving something else, which is what the #1349 review pointed out.
        run: bun install --frozen-lockfile

      - name: Setup database
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://rapitas:rapitas@localhost:5432/rapitas_test
        run: |
          bunx prisma db push --skip-generate
          bun run db:generate

      - name: Start backend
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://rapitas:rapitas@localhost:5432/rapitas_test
          PORT: 3001
          NODE_ENV: test
        run: |
          bun run index.ts &
          sleep 5

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3001/health > /dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 1
          done

      - name: Measure API latency
        id: api-perf
        run: |
          {
            echo "## API Performance Results"
            echo ""
            echo "| Endpoint | Cold Start | P50 | P95 |"
            echo "|----------|------------|-----|-----|"
          } >> "$GITHUB_STEP_SUMMARY"

          # NOTE: samples are kept in an array (not a space-joined string) so the
          # sort pipeline needs no unquoted word splitting (shellcheck SC2086);
          # printf emits one sample per line, as the old `echo | tr` did.
          for ENDPOINT in /health /tasks /settings; do
            COLD=$(curl -s -o /dev/null -w "%{time_total}" "http://localhost:3001${ENDPOINT}")
            COLD_MS=$(echo "$COLD * 1000" | bc)

            TIMES=()
            for _ in {1..10}; do
              TIMES+=("$(curl -s -o /dev/null -w "%{time_total}" "http://localhost:3001${ENDPOINT}")")
            done
            P50=$(printf '%s\n' "${TIMES[@]}" | sort -n | awk 'NR==5{print $1 * 1000}')
            P95=$(printf '%s\n' "${TIMES[@]}" | sort -n | awk 'NR==10{print $1 * 1000}')
            echo "| ${ENDPOINT} | ${COLD_MS}ms | ${P50}ms | ${P95}ms |" >> "$GITHUB_STEP_SUMMARY"
          done

  frontend-bundle:
    name: Frontend Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # NOTE(#1340 step 1): was `9`. This job pinned a different pnpm MAJOR
          # from every other one, and the first version of the drift check only
          # looked at `npm install -g pnpm@X` so it reported every workflow as
          # matching. Kept in action-setup form on purpose — the check now reads
          # this form too, so the two styles cannot diverge again unnoticed.
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: rapitas-frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: rapitas-frontend
        # NOTE(#1340 step 1): frozen now. This comment used to read:
        #
        #   "--no-frozen-lockfile matches the bundle-size + tauri-build jobs; a
        #    plain frozen install fails with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH
        #    when the lockfile's overrides drift from package.json."
        #
        # That was recorded while this job ran pnpm 9 and the others floated on
        # pnpm@10. With one pinned pnpm the premise no longer holds: the Frozen
        # Install Verification job installs all three packages with
        # --frozen-lockfile on 10.34.9 and passes. A non-frozen install lets the
        # job resolve its own tree, so what gets measured or shipped is not what
        # the committed lockfile describes.
        #
        # If this does start failing with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH, the
        # lockfile and package.json genuinely disagree — reconcile them, do not
        # reintroduce --no-frozen-lockfile to hide it.
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: rapitas-frontend
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Analyze bundle size
        working-directory: rapitas-frontend
        run: |
          {
            echo "## Frontend Bundle Analysis"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Calculate JS size
          JS_SIZE=$(find .next/static -name "*.js" -exec stat -c%s {} \; | awk '{sum+=$1} END {print sum}')
          JS_SIZE_KB=$(echo "scale=2; $JS_SIZE / 1024" | bc)

          # Calculate CSS size
          CSS_SIZE=$(find .next/static -name "*.css" -exec stat -c%s {} \; 2>/dev/null | awk '{sum+=$1} END {print sum}')
          CSS_SIZE_KB=$(echo "scale=2; ${CSS_SIZE:-0} / 1024" | bc)

          # Total
          TOTAL_KB=$(echo "scale=2; $JS_SIZE_KB + $CSS_SIZE_KB" | bc)

          {
            echo "| Asset Type | Size |"
            echo "|------------|------|"
            echo "| JavaScript | ${JS_SIZE_KB} KB |"
            echo "| CSS | ${CSS_SIZE_KB} KB |"
            echo "| **Total** | **${TOTAL_KB} KB** |"

            # Check threshold (500KB)
            echo ""
            if (( $(echo "$TOTAL_KB > 500" | bc -l) )); then
              echo "⚠️ **Warning**: Bundle size exceeds 500KB threshold"
            else
              echo "✅ Bundle size is within threshold"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
